services:
  app:
    build: .
    container_name: app
    working_dir: /var/www
    volumes:
      - ./laravel:/var/www
      - ./php.ini:/usr/local/etc/php/php.ini
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db_test
      DB_PORT: 3306
      DB_DATABASE: laravel_test
      DB_USERNAME: laravel_test
      DB_PASSWORD: laravel_test

    networks:
      - laravel
  webserver:
    image: nginx:latest
    container_name: nginx_servertp1
    ports:
      - "8100:80"
    volumes:
      - ./laravel:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel
  # db:
  #   image: mysql:8.0
  #   container_name: mysql_dbtp1
  #   ports:
  #     - "3308:3306"
  #   environment:
  #     MYSQL_ROOT_PASSWORD: root
  #     MYSQL_DATABASE: laravel
  #     MYSQL_USER: laravel
  #     MYSQL_PASSWORD: laravel
  #   networks:
  #     - laravel
  db_test:
    image: mysql:8.0
    container_name: mysql_dbtest
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_test
      MYSQL_USER: laravel_test
      MYSQL_PASSWORD: laravel_test
    networks:
      - laravel
networks:
  laravel:
    driver: bridge